<!doctype html>
<html>
  <body style="margin:0;background:#FBF8F3;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:#1F2937;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFFFF;border-radius:16px;padding:32px;">
            <tr><td style="font-size:20px;font-weight:700;color:#F57E16;padding-bottom:24px;">Grouv</td></tr>
            <tr>
              <td style="font-size:16px;line-height:1.6;">
                <p style="margin:0 0 16px;">Here's your code to change your Grouv password:</p>
                <p style="margin:0 0 16px;font-size:32px;font-weight:700;letter-spacing:8px;">{{ .Token }}</p>
                <p style="margin:0;color:#6B7280;font-size:14px;">It expires in 8 minutes. If you didn't ask to change your password, don't share this code with anyone — your password stays as it is.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
